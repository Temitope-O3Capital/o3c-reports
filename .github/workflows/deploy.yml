name: Deploy

# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST        - IP address or hostname of the on-prem server
#   SSH_PRIVATE_KEY    - Private key for the deploy user on the server
#   VITE_API_URL       - Backend URL visible to the browser, e.g. https://workspace.o3ccards.com

on:
  push:
    branches: [main]
  # Run the gate on pull requests too. Until now nothing was verified until it
  # was already on main, which is the wrong order — especially for
  # handlers/integration_test.go, which needs the Postgres service to run at all.
  # The deploy job below stays pinned to main, so a PR validates but never ships.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── D5: Secret scanning — must run before anything else ─────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Quality gate — must pass before deploy ───────────────────────────────────
  test:
    name: Test & Type-check
    needs: [secret-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: o3c_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # ── Go backend ──────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          # Keep in step with backend-go/Dockerfile and the toolchain line in go.mod.
          # govulncheck reports the standard library of the Go it runs under, so a
          # stale patch release here fails the scan (1.25.11 carried 8 stdlib CVEs).
          go-version: '1.25.14'
          cache-dependency-path: backend-go/go.sum

      - name: Go tests
        # 300s, not 120s: handlers/integration_test.go migrates the service
        # database from empty, which is ~290 migration files. That run is the
        # point — a migration that fails only ever failed at startup before, and
        # no unit test starts the server.
        run: go test ./... -v -race -timeout 300s
        working-directory: backend-go
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/o3c_test
          SECRET_KEY: ci-test-secret-key-32-chars-long!!
          ENCRYPTION_KEY: ci-test-encr-key-32-chars-long!!

      - name: govulncheck
        # Pinned, not @latest. govulncheck v1.8.0+ requires Go 1.26, so with the
        # toolchain pinned to 1.25 an @latest install fails before it scans
        # anything. v1.7.0 supports Go 1.25; the vulnerability database is fetched
        # at run time, so a pinned tool still reports current advisories.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
        working-directory: backend-go

      # ── Frontend ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Is the on-prem deploy actually configured? ──────────────────────────────
  # SERVER_HOST and SSH_PRIVATE_KEY have never been set on this repository (the
  # only secret it holds is CF_ACCOUNT_ID), so every push to main ended red at
  # "Configure SSH": the key file was written as an empty string and ssh-keyscan
  # was invoked with no host at all. A permanently red main teaches everyone to
  # ignore it, which hides the failures that matter — so the deploy is skipped,
  # with a warning that says why, until the secrets exist.
  #
  # This needs its own job because the `secrets` context is not available to a
  # job-level `if`; it is only readable inside a step.
  preflight:
    name: Deploy configured?
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=On-prem deploy skipped::SERVER_HOST and/or SSH_PRIVATE_KEY are not set on this repository, so there is nothing to deploy to. Set both in Settings → Secrets and variables → Actions to enable it."
          fi

  # ── Deploy — on-prem server via SSH ─────────────────────────────────────────
  deploy:
    name: Deploy (On-prem)
    needs: [test, preflight]
    # main only: a pull request runs the gate but must never ship.
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build React frontend on CI (avoids needing Node on the server)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Set up SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # Push frontend build to the server
      - name: Sync frontend build
        run: |
          rsync -az --delete frontend/dist/ \
            deploy@${{ secrets.SERVER_HOST }}:/opt/o3c/frontend/dist/

      # Rebuild and restart the Go API container
      - name: Deploy backend
        run: |
          ssh deploy@${{ secrets.SERVER_HOST }} "
            set -e
            cd /opt/o3c
            git pull origin main
            docker compose up -d --build api
            docker compose ps
          "
