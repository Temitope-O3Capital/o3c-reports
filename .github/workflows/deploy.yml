name: Deploy

# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST        - IP address or hostname of the on-prem server
#   SSH_PRIVATE_KEY    - Private key for the deploy user on the server
#   VITE_API_URL       - Backend URL visible to the browser, e.g. https://workspace.o3ccards.com

on:
  push:
    branches: [main]

jobs:
  # ── D5: Secret scanning — must run before anything else ─────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Quality gate — must pass before deploy ───────────────────────────────────
  test:
    name: Test & Type-check
    needs: [secret-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: o3c_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # ── Go backend ──────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: backend-go/go.sum

      - name: Go tests
        run: go test ./... -v -race -timeout 120s
        working-directory: backend-go
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/o3c_test
          SECRET_KEY: ci-test-secret-key-32-chars-long!!
          ENCRYPTION_KEY: ci-test-encr-key-32-chars-long!!

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: backend-go

      # ── Frontend ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Deploy — on-prem server via SSH ─────────────────────────────────────────
  deploy:
    name: Deploy (On-prem)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build React frontend on CI (avoids needing Node on the server)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Set up SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # Push frontend build to the server
      - name: Sync frontend build
        run: |
          rsync -az --delete frontend/dist/ \
            deploy@${{ secrets.SERVER_HOST }}:/opt/o3c/frontend/dist/

      # Rebuild and restart the Go API container
      - name: Deploy backend
        run: |
          ssh deploy@${{ secrets.SERVER_HOST }} "
            set -e
            cd /opt/o3c
            git pull origin main
            docker compose up -d --build api
            docker compose ps
          "
